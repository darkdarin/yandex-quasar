name: Adapter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapter
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Generate protobuf modules (quasar-protos)
        run: tools/gen_protos.sh
      - name: Run tests
        run: uv run pytest -q

  # The app image as the release builds it (amd64 only, not published): catches Dockerfile breakage before a tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the build context
        id: stage
        run: echo "dir=$(ha-addon/build.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.stage.outputs.dir }}
          platforms: linux/amd64
          build-args: BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.14-alpine3.22
          push: false
          load: true
          tags: quasar-adapter:ci
          cache-from: type=gha,scope=amd64
      # The image must also run without the Supervisor (docker-compose.yml): run.sh falls back to QUASAR_* variables.
      - name: Start without the Supervisor
        run: |
          mkdir -p data
          docker run -d --name adapter --network host -v "$PWD/data:/data" -e QUASAR_SENDSPIN_ENABLED=false \
            quasar-adapter:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:8080/quasar/get_sync_info?device_id=ci" && break
            sleep 2
          done
          docker logs adapter
          curl -sf -o /dev/null "http://127.0.0.1:8080/quasar/get_sync_info?device_id=ci"
          test -s data/api_token
          test -d data/seed
