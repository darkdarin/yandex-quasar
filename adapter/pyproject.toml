[project]
name = "quasar-adapter"
version = "0.2.18"
description = "Local Yandex Station backend (quasar/uniproxy emulation) bridging to Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "adb-shell[async]>=0.4.4",
    "aiohttp>=3.10",
    "aiosendspin>=10.2,<10.3",
    "asyncssh>=2.21",
    "av>=19.0.2",
    "numpy>=2.5.4",
    "protobuf>=7.36.2",
    "zeroconf>=0.151.5",
    "zstandard>=0.23",
]

[project.scripts]
quasar-adapter = "quasar_adapter.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quasar_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
